[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "worker*", "engine*", "seed*"]

[project]
name = "procurementos-agent"
version = "0.1.0"
description = "Standalone Autonomous Procurement Agent (deterministic engine + approval gates)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.141,<0.142",
  "starlette>=1.7,<1.8",
  "uvicorn[standard]>=0.30,<0.33",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.3,<3",
  "sqlalchemy[asyncio]>=2.0,<2.1",
  "asyncpg>=0.29,<0.30",
  "psycopg[binary]>=3.1,<3.3",
  "alembic>=1.13,<1.14",
  "redis>=5.0,<6",
  "rq>=1.16,<2",
  "boto3>=1.34,<2",
  "python-multipart>=0.0.12",
  "pyjwt[crypto]>=2.10,<3",
  "httpx>=0.27,<0.28",
  "duckdb>=1.1,<1.6",
  "polars>=1.0,<2",
  "structlog>=24.1,<25",
  "tenacity>=8.3,<9",
  "openpyxl>=3.1,<3.2",
  "reportlab>=4.0,<4.3",
]

[project.optional-dependencies]
dev = [
  "pytest>=9,<10",
  "pytest-asyncio>=1,<2",
  "httpx>=0.27,<0.28",
  "ruff>=0.5,<0.6",
  "mypy>=1.11,<1.12",
  "pip-audit>=2.7,<2.8",
]

[tool.pytest.ini_options]
testpaths = ["tests", "engine/tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S106"]
"engine/tests/**/*.py" = ["S101"]
"app/auth/deps.py" = ["B008"]
"app/api/*.py" = ["B008"]
# Generated migrations: reviewed, never hand-edited except the header.
"alembic/versions/*.py" = ["E501", "I001"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["openpyxl.*", "reportlab.*", "jose.*"]
ignore_missing_imports = true

[tool.alembic]
script_location = "alembic"
