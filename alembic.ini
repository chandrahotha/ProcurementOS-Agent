# Alembic config — ProcurementOS-Agent (pos_* schema).
#
# The URL below is a LOCAL DEV target with NO password on purpose: a
# committed password is a committed secret, and "pos/pos" is exactly how a
# staging or production deployment ends up inheriting the dev credential.
# Every non-dev environment sets DATABASE_SYNC_URL, which overrides this
# (see alembic/env.py). When neither is usable the migration refuses to
# start with an explicit message instead of guessing.
#
# Local dev against the compose stack:
#   $env:DATABASE_SYNC_URL="postgresql+psycopg://pos:pos@localhost:5432/pos"
#   alembic upgrade head
[alembic]
script_location = alembic
sqlalchemy.url = postgresql+psycopg://pos@localhost:5432/pos

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
