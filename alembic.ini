# Alembic config — ProcurementOS-Agent (pos_* schema).
# URL is a default only; set DATABASE_SYNC_URL to override per environment.
[alembic]
script_location = alembic
sqlalchemy.url = postgresql+psycopg://pos:pos@localhost:5432/pos

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
