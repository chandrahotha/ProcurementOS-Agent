name: Feature request
description: Propose something the agent should do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve, and for whom
      description: Buyer, manager, finance, compliance — what changes for them
    validations:
      required: true
  - type: textarea
    id: brain
    attributes:
      label: Where does this fit in the brain
      description: prerequisite-docs section, or "new — needs an ADR"
  - type: checkboxes
    id: gates
    attributes:
      label: Hard rules
      options:
        - label: Deterministic math stays the source of truth (AI explains only)
        - label: No auto-award, auto-commit, or auto-send slips in
        - label: Every new number traces to evidence or a reasoned waiver
