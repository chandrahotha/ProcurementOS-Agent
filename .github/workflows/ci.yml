name: ci

# Cadence (changed 2026-10-20, was weekly-only):
#   push to main + every PR  -> the FAST gate chain (lint, typecheck, unit,
#                                 security-lint, dep-scan, secret-scan, web).
#   schedule (Mon 03:00 UTC)  -> FAST chain + the HEAVY legs (Postgres
#                                 migration + seed + PG-backed tests, Docker
#                                 build, Playwright e2e).
#   workflow_dispatch        -> everything, on demand.
#
# The old file ran only on the weekly schedule, so a regression could sit on
# main for up to seven days. The fast chain exists to make a bad push fail
# within minutes; the heavy legs stay weekly because they need containers and
# a second Postgres, which is a poor price for every keystroke pushed.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

# Cancel overlapping runs on the same ref (bugs/04-infra-ci.md I27).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege token for every job (I12).
permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

jobs:
  # ---------------------------------------------------------------- fast chain
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install "ruff>=0.17,<0.18"
      - run: ruff check app worker engine seed tests alembic scripts
      - run: ruff format --check app worker engine seed tests alembic scripts

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: lint
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.lock
      - run: pip install -r requirements.lock
      - run: pip install -e . --no-deps
      - run: mypy app worker engine seed scripts
      # The lockfile must match the declared ranges (I20). A range bump that
      # does not refresh the lock fails here, in the same commit.
      - run: python scripts/lock.py --check

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: typecheck
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.lock
      - run: pip install -r requirements.lock
      - run: pip install -e . --no-deps
      # The `integration` marker is real (tests/test_postgres.py) — the
      # `-m "not integration"` filter now actually excludes something (I6).
      - run: pytest -q -m "not integration" --cov=app --cov=engine --cov-report=term-missing
      - name: Coverage floor
        # fail_under lives in pyproject [tool.coverage.report]; pytest-cov
        # enforces it. This step only makes the number visible in the log.
        run: pytest -q -m "not integration" --cov=app --cov=engine --cov-report=xml
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore
      # The operational drills. Each is a command with an exit code, so
      # each is a gate rather than a promise: the migration chain is
      # reversible, the egress policy holds against a live host, and the
      # environment templates are complete and separated.
      - name: Migration chain is reversible (scratch database)
        run: python scripts/rollback.py --db-url sqlite:///./rollback_scratch.db
      - name: SSRF / egress drill against a live host
        run: python scripts/ssrf_drill.py
      - name: Environment templates are complete and separated
        run: python scripts/verify_env.py --check-templates
      - name: Seed fixtures match the generator
        run: python seed/make_fixtures.py --check
      - name: No text file was written with the wrong code page
        run: python scripts/check_encoding.py

  security-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: unit
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install "ruff>=0.17,<0.18"
      - run: ruff check --select S app worker engine seed alembic scripts

  dep-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: security-lint
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.lock
      - run: pip install -r requirements.lock
      - run: pip install -e . --no-deps
      # Audit the lockfile, not the ambient environment: the lockfile is
      # exactly what CI installs, so the answer is reproducible. Auditing
      # the environment audits whatever happens to be in it.
      - run: pip-audit --strict --requirement requirements.lock
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      # The dependency gate separates the shipped artefact from the build
      # toolchain: a production advisory always fails, and a development
      # advisory fails unless it is on the reviewed exception list in
      # scripts/npm_audit.py. The raw `npm audit` calls that were here
      # failed on any advisory at all, which made them a gate nobody could
      # satisfy and a claim nobody could check.
      - run: python scripts/npm_audit.py --prefix web

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: dep-scan
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      # gitleaks stays on its tag: upstream documents tag usage with the
      # default token; pinned-SHA would need a separately managed ref.
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: secret-scan
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web
      - run: npm run lint --prefix web
      - run: npm run build --prefix web
      - run: npm run typecheck --prefix web
      - run: npm run test --prefix web

  # --------------------------------------------------------------- heavy chain
  # The heavy legs run on the weekly schedule and on manual dispatch only.
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: unit
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pos
          POSTGRES_PASSWORD: pos
          POSTGRES_DB: pos
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U pos" --health-interval=5s
          --health-timeout=3s --health-retries=10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd="redis-cli ping" --health-interval=5s
          --health-timeout=3s --health-retries=10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.lock
      - run: pip install -r requirements.lock
      - run: pip install -e . --no-deps
      # Migration chain against real Postgres: up, then down, then up again
      # (the expand->migrate->contract rehearsal the release gate asks for).
      - name: Alembic upgrade head (Postgres)
        run: alembic upgrade head
        env:
          DATABASE_SYNC_URL: postgresql+psycopg://pos:pos@localhost:5432/pos
      - name: Seed against Postgres
        run: python seed/seed_pos.py --tenant SYN-TENANT-01
        env:
          DATABASE_URL: postgresql+asyncpg://pos:pos@localhost:5432/pos
      - name: Postgres-backed tests (the `integration` marker is real)
        run: pytest -q -m integration
        env:
          DATABASE_URL: postgresql+asyncpg://pos:pos@localhost:5432/pos
          DATABASE_SYNC_URL: postgresql+psycopg://pos:pos@localhost:5432/pos
      - name: Alembic downgrade base (rollback rehearsal)
        run: alembic downgrade base
        env:
          DATABASE_SYNC_URL: postgresql+psycopg://pos:pos@localhost:5432/pos
      - name: Alembic upgrade head again (restore rehearsal)
        run: alembic upgrade head
        env:
          DATABASE_SYNC_URL: postgresql+psycopg://pos:pos@localhost:5432/pos

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: web
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: docker compose build api worker web

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.lock
      - run: pip install -r requirements.lock
      - run: pip install -e . --no-deps
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web
      - run: npm run build --prefix web
      - run: npx playwright install chromium --only-shell
        working-directory: web
      - run: npm run e2e --prefix web
        env:
          CI: "true"
