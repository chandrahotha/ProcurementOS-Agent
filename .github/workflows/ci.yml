name: ci

on:
  push:
    branches: [main]
  pull_request:

# Cancel overlapping runs on the same ref (bugs/04-infra-ci.md I27).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege token for every job (I12).
permissions:
  contents: read

jobs:
  # Binding order per 10 §add-on: lint -> typecheck -> unit -> integration
  # -> security lint -> dep scan -> secret scan -> build -> e2e.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install "ruff>=0.5,<0.6"
      - run: ruff check app worker engine seed tests alembic
      - run: ruff format --check app worker engine seed tests alembic

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: lint
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: mypy app worker engine seed

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: typecheck
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: pytest -q -m "not integration" --ignore=tests/golden --cov=app --cov=engine --cov-report=term-missing
        # golden + DB/Redis-marked suites run below so hostile-doc + outage suites are mandatory

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: unit
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pos
          POSTGRES_PASSWORD: pos
          POSTGRES_DB: pos
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U pos" --health-interval=5s
          --health-timeout=3s --health-retries=10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd="redis-cli ping" --health-interval=5s
          --health-timeout=3s --health-retries=10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: alembic upgrade head
        env:
          DATABASE_SYNC_URL: postgresql+psycopg://pos:pos@localhost:5432/pos
      - run: python seed/seed_pos.py --tenant SYN-TENANT-01
        env:
          DATABASE_URL: postgresql+asyncpg://pos:pos@localhost:5432/pos
      - run: pytest -q tests/golden
      - run: pytest -q --ignore=tests/golden
      - run: pytest -q -m integration

  security-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: integration
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: pip install "ruff>=0.5,<0.6"
      - run: ruff check --select S app worker engine seed alembic

  dep-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: security-lint
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: pip-audit
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm audit --prefix web --omit=dev
      - run: npm audit --prefix web

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: dep-scan
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      # gitleaks stays on its tag: upstream documents tag usage with the
      # default token; pinned-SHA would need a separately managed ref.
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: secret-scan
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: docker compose build api worker web
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web
      - run: npm run lint --prefix web
      - run: npm run build --prefix web
      - run: npm run typecheck --prefix web
      - run: npm run test --prefix web

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web
      - run: npm run build --prefix web
      - run: npx playwright install chromium --only-shell
        working-directory: web
      - run: npm run e2e --prefix web
        env:
          CI: "true"
