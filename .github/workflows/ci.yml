name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Binding order per 10 §add-on: lint -> typecheck -> unit -> integration
  # -> security lint -> dep scan -> secret scan -> build.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install "ruff>=0.5,<0.6"
      - run: ruff check app worker engine seed tests alembic
      - run: ruff format --check app worker engine seed tests alembic

  typecheck:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]"
      - run: mypy app worker engine seed

  unit:
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]"
      - run: pytest -q -m "not integration" --ignore=tests/golden
        # golden + integration run below so hostile-doc + outage suites are mandatory

  integration:
    runs-on: ubuntu-latest
    needs: unit
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pos
          POSTGRES_PASSWORD: pos
          POSTGRES_DB: pos
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U pos" --health-interval=5s
          --health-timeout=3s --health-retries=10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]"
      - run: alembic upgrade head
        env:
          DATABASE_SYNC_URL: postgresql+psycopg://pos:pos@localhost:5432/pos
      - run: python seed/seed_pos.py --tenant SYN-TENANT-01
        env:
          DATABASE_URL: postgresql+asyncpg://pos:pos@localhost:5432/pos
      - run: pytest -q tests/golden
      - run: pytest -q

  security-lint:
    runs-on: ubuntu-latest
    needs: integration
    steps:
      - uses: actions/checkout@v4
      - run: pip install "ruff>=0.5,<0.6"
      - run: ruff check --select S app worker engine seed

  dep-scan:
    runs-on: ubuntu-latest
    needs: security-lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pip-audit
      - run: pip-audit

  secret-scan:
    runs-on: ubuntu-latest
    needs: dep-scan
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2

  build:
    runs-on: ubuntu-latest
    needs: secret-scan
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build api worker
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: npm ci --prefix web
      - run: npm run typecheck --prefix web
      - run: npm run test --prefix web
      - run: npm run build --prefix web

  e2e:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e .
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: npm ci --prefix web
      - run: npm run build --prefix web
      - run: npx --prefix web playwright install chromium --only-shell
      - run: npm run e2e --prefix web
        env:
          CI: "true"
